# Dependency Review（二阶段 P2 security gate）。
#
# GitHub 原生对比 PR 新引入依赖的已知漏洞与许可，只在 pull_request 上有意义。
# 审计等级 high 起判定失败，与 CI 里的 npm audit 门禁保持同一标准。
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: depreview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The previous SHA did not exist in the action's repository, and upstream publishes
      # no floating `v4` tag, so the gate could never run. Pinned to v5.0.0 (node24 runtime).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
